name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types (informative)
        run: npm run lint
        continue-on-error: true
      - name: Tests
        run: npm test
      - name: Build de production
        run: npm run build
