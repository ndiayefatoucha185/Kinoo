      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>
  <!-- Background rounded canvas -->
  <rect width="128" height="128" rx="28" fill="#09090B" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#232326" stroke-width="2" />
  
  <!-- KINOO K + Play Apex Symbol -->
